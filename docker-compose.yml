version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: robovault-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-robovault_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-robovault_secure_pass_2026}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-robovault}
    ports:
      # Bound to localhost only to prevent public network exposure
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - robovault-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $${MONGO_INITDB_ROOT_USERNAME:-robovault_admin} -p $${MONGO_INITDB_ROOT_PASSWORD:-robovault_secure_pass_2026} --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robovault-backend
    restart: always
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-robovault_admin}:${MONGO_INITDB_ROOT_PASSWORD:-robovault_secure_pass_2026}@mongodb:27017/${MONGO_INITDB_DATABASE:-robovault}?authSource=admin
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - robovault-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robovault-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - robovault-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    driver: local

networks:
  robovault-net:
    driver: bridge
