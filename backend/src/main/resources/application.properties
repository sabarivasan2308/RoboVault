# ==========================================
# Spring Boot Configuration - RoboVault
# ==========================================

spring.application.name=robovault-backend
server.port=${SERVER_PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/robovault}
spring.data.mongodb.auto-index-creation=true

# Security / JWT Configuration
# Note: JWT_SECRET must be provided via environment variable (minimum 256 bits / 32 bytes)
robovault.jwt.secret=${JWT_SECRET:}
robovault.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.root=INFO
logging.level.com.robovault=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring Web JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
