# ==========================================
# Spring Boot Configuration - RoboVault
# ==========================================

spring.application.name=robovault-backend
server.port=${SERVER_PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/robovault}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.root=INFO
logging.level.com.robovault=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring Web JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Seed initial sample data if empty
robovault.init-sample-data=true

